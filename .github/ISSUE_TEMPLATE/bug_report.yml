name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem, including any configuration.
      render: swift
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SlideToConfirm, Xcode, and OS (for example 1.0.0 · Xcode 26.3 · iOS 26.2 simulator).
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input method
      multiple: true
      options:
        - Drag
        - Hold
        - Keyboard
        - VoiceOver / Switch Control / Voice Control
        - UIKit wrapper
